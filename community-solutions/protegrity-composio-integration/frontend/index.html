<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protegrity Secure Data Bridge</title>
  <script src="/static/tailwind.min.js"></script>
  <script src="/static/react.production.min.js"></script>
  <script src="/static/react-dom.production.min.js"></script>
  <script src="/static/babel.min.js"></script>
  <style>
    /* ═══════════════════════════════════════════════════════════════
       Protegrity × Composio  ·  White / Light-Gold / Light-Blue Theme
       ═══════════════════════════════════════════════════════════════ */
    :root {
      --gold-50:  #FFFDF5; --gold-100: #FDF3D0; --gold-200: #F5E4A0;
      --gold-400: #D4AF5A; --gold-600: #C09A3A; --gold-700: #A0801E;
      --gold-800: #7A5C14;
      --blue-50:  #EFF7FF; --blue-100: #DBE9FF;
      --blue-300: #93C5FD; --blue-600: #2272B4;
      --blue-700: #1D6FA4; --blue-800: #175480;
      --warm-50:  #FAFAF7; --warm-100: #F3EEE5; --warm-200: #E8E0D2;
      --warm-300: #D5CBBA; --warm-400: #BCB0A0; --warm-500: #978D82;
      --warm-600: #6E6258; --warm-800: #3D3530; --warm-900: #1C1917;
    }

    /* ── Page base ── */
    body { background: #FFFFFF !important; }
    .min-h-screen { background: #FFFFFF; }

    /* ── Dark backgrounds → light ── */
    [class*="bg-gray-9"]  { background-color: var(--warm-50)  !important; }
    [class*="bg-gray-8"]  { background-color: var(--warm-100) !important; }
    [class*="bg-gray-7"]  { background-color: var(--warm-200) !important; }

    /* ── Borders ── */
    [class*="border-gray-8"] { border-color: var(--warm-200) !important; }
    [class*="border-gray-7"] { border-color: var(--warm-300) !important; }
    [class*="border-gray-6"] { border-color: var(--warm-400) !important; }

    /* ── Text ── */
    .text-white              { color: var(--warm-900) !important; }
    [class*="text-gray-2"]   { color: var(--warm-900) !important; }
    [class*="text-gray-3"]   { color: var(--warm-800) !important; }
    [class*="text-gray-4"]   { color: var(--warm-600) !important; }
    [class*="text-gray-5"]   { color: var(--warm-500) !important; }
    [class*="text-gray-6"]   { color: var(--warm-400) !important; }

    /* ── Indigo → Light Blue ── */
    [class*="bg-indigo-6"]   { background-color: var(--blue-700) !important; color: #fff !important; }
    [class*="bg-indigo-7"]   { background-color: var(--blue-700) !important; color: #fff !important; }
    [class*="bg-indigo-9"]   { background-color: var(--blue-50)  !important; }
    [class*="border-indigo"] { border-color: var(--blue-300) !important; }
    [class*="text-indigo-1"] { color: var(--warm-900) !important; }
    [class*="text-indigo-2"] { color: var(--blue-700) !important; }
    [class*="text-indigo-3"] { color: var(--blue-700) !important; }
    [class*="text-indigo-4"] { color: var(--blue-700) !important; }
    [class*="bg-indigo-6"]:hover { background-color: var(--blue-800) !important; }
    [class*="bg-indigo-7"]:hover { background-color: var(--blue-800) !important; }

    /* ── Violet → Blue (primary action buttons) ── */
    [class*="bg-violet-6"]   { background-color: var(--blue-700) !important; color: #fff !important; }
    [class*="bg-violet-9"]   { background-color: var(--blue-50)  !important; }
    [class*="border-violet"] { border-color: var(--blue-300) !important; }
    [class*="text-violet"]   { color: var(--blue-700) !important; }
    [class*="bg-violet-6"]:hover { background-color: var(--blue-800) !important; }

    /* ── Orange → Gold (PII highlights) ── */
    [class*="bg-orange-9"]   { background-color: var(--gold-100) !important; }
    [class*="bg-orange-7"]   { background-color: var(--gold-600) !important; color: #fff !important; }
    [class*="text-orange-3"] { color: var(--gold-700) !important; }
    [class*="text-orange-2"] { color: var(--gold-800) !important; }
    [class*="text-orange-4"] { color: var(--gold-700) !important; }
    [class*="bg-orange-7"]:hover { background-color: var(--gold-700) !important; }

    /* ── Amber → Gold ── */
    [class*="bg-amber-9"]   { background-color: var(--gold-100) !important; }
    [class*="bg-amber-8"]   { background-color: var(--gold-600) !important; color: #fff !important; }
    [class*="bg-amber-7"]   { background-color: var(--gold-600) !important; color: #fff !important; }
    [class*="border-amber"] { border-color: var(--gold-400) !important; }
    [class*="text-amber"]   { color: var(--gold-700) !important; }
    [class*="bg-amber-8"]:hover, [class*="bg-amber-7"]:hover { background-color: var(--gold-700) !important; }

    /* ── Blue info boxes ── */
    [class*="bg-blue-9"]   { background-color: var(--blue-50)  !important; }
    [class*="border-blue"] { border-color: var(--blue-300) !important; }
    [class*="text-blue-1"] { color: var(--warm-900) !important; }
    [class*="text-blue-2"] { color: var(--blue-700) !important; }
    [class*="text-blue-3"] { color: var(--blue-700) !important; }

    /* ── Green states ── */
    [class*="bg-green-9"]   { background-color: #F0FDF4 !important; }
    [class*="border-green"] { border-color: #6EE7A0 !important; }
    [class*="text-green-3"] { color: #047857 !important; }
    [class*="text-green-4"] { color: #047857 !important; }
    [class*="bg-green-7"]   { background-color: #059669 !important; color: #fff !important; }
    [class*="bg-green-7"]:hover { background-color: #047857 !important; }

    /* ── Red states ── */
    [class*="bg-red-9"]   { background-color: #FEF2F2 !important; }
    [class*="border-red"] { border-color: #FCA5A5 !important; }
    [class*="text-red-3"] { color: #DC2626 !important; }
    [class*="text-red-4"] { color: #DC2626 !important; }
    [class*="bg-red-8"]   { background-color: #DC2626 !important; color: #fff !important; }
    [class*="bg-red-8"]:hover { background-color: #B91C1C !important; }

    /* ── Inputs, textareas, selects ── */
    input, textarea, select {
      background-color: #FFFFFF !important;
      border-color: var(--warm-300) !important;
      color: var(--warm-900) !important;
    }
    input::placeholder, textarea::placeholder { color: var(--warm-400) !important; }
    select option { background: #FFFFFF; color: var(--warm-900); }

    /* ── Code / pre blocks ── */
    pre {
      background-color: var(--warm-100) !important;
      border-color: var(--warm-200) !important;
      color: var(--warm-800) !important;
    }
    code { color: var(--gold-800) !important; }

    /* ── Table hover rows ── */
    [class*="hover:bg-gray-8"]:hover { background-color: var(--warm-200) !important; }
    [class*="hover:bg-white"]:hover  { background-color: rgba(212,175,90,0.07) !important; }

    /* ── Checkboxes ── */
    input[type="checkbox"] { accent-color: var(--blue-700); }

    /* ── Scrollbars ── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: var(--warm-50); }
    ::-webkit-scrollbar-thumb { background: var(--gold-400); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--gold-600); }

    /* ── PII token highlight ── */
    .token-highlight {
      background: rgba(212,175,90,0.18) !important;
      border: 1px solid rgba(212,175,90,0.45) !important;
      border-radius: 3px;
      padding: 0 2px;
    }

    /* ── Header: gold-accented white bar ── */
    header {
      background-color: #FFFFFF !important;
      border-bottom: 1.5px solid var(--gold-400) !important;
      box-shadow: 0 2px 10px rgba(212,175,90,0.14) !important;
    }
    header h1 {
      background: linear-gradient(120deg, var(--blue-700) 0%, var(--gold-600) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      font-weight: 800 !important;
      letter-spacing: -0.02em;
    }

    /* ── Card: subtle lift shadow ── */
    .rounded-xl { box-shadow: 0 1px 4px rgba(0,0,0,0.05), 0 1px 2px rgba(212,175,90,0.07); }
  </style>
</head>
<body class="text-stone-900 min-h-screen" style="background:#fff">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

/* ── helpers ───────────────────────────────────────────────────── */
async function api(path, opts = {}) {
  const r = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...opts,
  });
  const d = await r.json().catch(() => ({ detail: r.statusText }));
  if (!r.ok) throw new Error(d.detail || JSON.stringify(d));
  return d;
}

const TOOLKIT_ICONS = {
  GITHUB: '🐙', GMAIL: '✉️', SLACK: '💬', GOOGLESHEETS: '📊',
  GOOGLEDRIVE: '📁', GOOGLEDOCS: '📄', GOOGLECALENDAR: '📅',
  NOTION: '📓', LINEAR: '📐', JIRA: '🧭', HUBSPOT: '🧲',
  SALESFORCE: '☁️', ASANA: '✅', TRELLO: '🗂️', DROPBOX: '📦',
  AIRTABLE: '🗃️', DISCORD: '🎧', OUTLOOK: '📧', ZOOM: '🎥',
  CONFLUENCE: '📚',
};
const iconFor = slug => TOOLKIT_ICONS[slug] || '🔌';

/* ── small components ──────────────────────────────────────────── */
function Badge({ ok, label }) {
  const cls = ok === undefined
    ? 'bg-gray-800 text-gray-500'
    : ok ? 'bg-green-900/60 text-green-300' : 'bg-gray-800 text-gray-400';
  return <span className={`text-xs px-2 py-0.5 rounded-full font-medium ${cls}`}>{ok ? '● ' : '○ '}{label}</span>;
}

function Card({ title, icon, children, dimmed }) {
  return (
    <div className={`rounded-xl border p-5 transition-opacity ${dimmed ? 'border-gray-800 opacity-60' : 'border-gray-700 bg-gray-900/60'}`}>
      {title && (
        <h2 className="text-sm font-semibold mb-4 flex items-center gap-2 text-gray-200">
          <span className="text-base">{icon}</span> {title}
        </h2>
      )}
      {children}
    </div>
  );
}

function Input({ label, hint, ...props }) {
  return (
    <div className="flex-1 min-w-52">
      {label && <label className="block text-xs text-gray-400 mb-1">{label}</label>}
      <input
        className="w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none placeholder-gray-600"
        {...props}
      />
      {hint && <p className="text-xs text-gray-500 mt-1">{hint}</p>}
    </div>
  );
}

function Btn({ children, variant = 'primary', ...props }) {
  const base = 'px-4 py-2 rounded-lg text-sm font-medium disabled:opacity-40 transition-colors';
  const variants = {
    primary: 'bg-indigo-600 hover:bg-indigo-500 text-white',
    green:   'bg-green-700 hover:bg-green-600 text-white',
    violet:  'bg-violet-600 hover:bg-violet-500 text-white',
    red:     'bg-red-800 hover:bg-red-700 text-gray-200',
    ghost:   'text-gray-400 hover:text-red-400 underline text-xs bg-transparent',
  };
  return <button className={`${base} ${variants[variant]}`} {...props}>{children}</button>;
}

function Spinner() {
  return <span className="animate-spin inline-block">⚙</span>;
}

function ErrorBox({ children }) {
  if (!children) return null;
  return (
    <div className="bg-red-900/30 border border-red-700/40 text-red-300 rounded-lg px-3 py-2 text-xs">
      ✗ {children}
    </div>
  );
}

/* ── Connection state (read-only — Composio owns all platform auth) ── */
/* ── Connections (read-only — Composio owns all platform auth) ─── */
function ConnectionsPanel({ apps, onRefresh, showAll }) {
  const [expanded, setExpanded] = useState(false);
  const composio = apps?.composio;
  const toolkits = apps?.toolkits || [];
  const connected = toolkits.filter(t => t.connected);
  const others = toolkits.filter(t => !t.connected);

  if (!apps) return <p className="text-xs text-gray-500">Checking Composio…</p>;

  return (
    <div className="space-y-3">
      {!composio?.configured && (
        <div className="bg-amber-900/30 border border-amber-700/40 text-amber-200 rounded-lg px-3 py-2 text-xs">
          ⚠ Composio is not configured. Set <span className="font-mono">COMPOSIO_API_KEY</span> in
          the server&rsquo;s <span className="font-mono">.env</span> and restart. This is the only
          credential this app uses.
        </div>
      )}
      {composio?.configured && composio?.error && <ErrorBox>{composio.error}</ErrorBox>}

      {connected.length > 0 && (
        <div>
          <p className="text-xs text-gray-400 mb-2">
            {connected.length} platform{connected.length === 1 ? '' : 's'} connected via Composio
          </p>
          <div className="grid grid-cols-2 md:grid-cols-3 gap-2">
            {connected.map(t => (
              <div key={t.slug}
                className="rounded-lg border border-green-700/40 bg-green-900/20 px-3 py-2">
                <div className="flex items-center gap-2">
                  <span>{iconFor(t.slug)}</span>
                  <span className="text-xs font-medium text-gray-200">{t.name}</span>
                  <span className="ml-auto text-green-300 text-xs">●</span>
                </div>
                {t.accounts.map((a, i) => (
                  <p key={i} className="text-xs text-gray-500 mt-1 truncate" title={a.identity}>
                    {a.identity || a.id}
                  </p>
                ))}
              </div>
            ))}
          </div>
        </div>
      )}

      {connected.length === 0 && composio?.reachable && (
        <div className="bg-amber-900/30 border border-amber-700/40 text-amber-200 rounded-lg px-3 py-2 text-xs">
          No platforms connected yet. Connect one in Composio to give the agent real tools.
        </div>
      )}

      {showAll && others.length > 0 && (
        <div>
          <button onClick={() => setExpanded(v => !v)}
            className="text-xs text-gray-400 hover:text-gray-200 underline">
            {expanded ? '▾' : '▸'} {others.length} more available to connect
          </button>
          {expanded && (
            <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mt-2">
              {others.map(t => (
                <div key={t.slug}
                  className="rounded-lg border border-gray-700 bg-gray-900/40 px-3 py-2 flex items-center gap-2">
                  <span className="opacity-50">{iconFor(t.slug)}</span>
                  <span className="text-xs text-gray-500">{t.name}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}

      <div className="flex items-center gap-3 text-xs">
        <a href={apps.connect_url} target="_blank" rel="noreferrer"
          className="text-indigo-300 hover:underline">
          Manage connections in Composio ↗
        </a>
        <button onClick={onRefresh} className="text-gray-400 hover:text-gray-200 underline">
          Refresh
        </button>
      </div>
    </div>
  );
}

/* ── PII-aware JSON viewer ─────────────────────────────────────── */
function JsonView({ json }) {
  if (!json) return null;
  const parts = String(json).split(/(\[[A-Z_]+\][\s\S]*?\[\/[A-Z_]+\])/g);
  return (
    <pre className="text-xs p-3 overflow-x-auto whitespace-pre-wrap max-h-96 rounded-lg">
      {parts.map((p, i) =>
        /^\[[A-Z_]+\]/.test(p)
          ? <span key={i} className="token-highlight">{p}</span>
          : <span key={i}>{p}</span>
      )}
    </pre>
  );
}

/* ══════════════════════════════════════════════════════════════════
   Connected Agent — an LLM agent whose platform connections are
   managed by Composio. Every tool result passes Protegrity Gate 1.
   ══════════════════════════════════════════════════════════════════ */
function ConnectedAgentTab({ apps, onRefresh, health }) {
  const PROMPTS = [
    'List the open issues in my GitHub repo and summarise them',
    'Summarise my unread emails and say who needs a reply',
    'Put my latest GitHub issues into a new spreadsheet',
  ];

  const [prompt, setPrompt] = useState('');
  const [runMode, setRunMode] = useState('auto');
  const [running, setRunning] = useState(false);
  const [result, setResult] = useState(null);
  const [error, setError] = useState('');
  const [role, setRole] = useState('viewer');
  const [revealed, setRevealed] = useState(null);

  async function run() {
    const text = prompt.trim();
    if (!text) return;
    setRunning(true); setError(''); setResult(null); setRevealed(null);
    try {
      const d = await api('/api/ask', {
        method: 'POST',
        body: JSON.stringify({ prompt: text, mode: runMode }),
      });
      if (d.error) setError(d.error);
      setResult(d);
    } catch (e) {
      setError(e.message || String(e));
    } finally {
      setRunning(false);
    }
  }

  async function reveal(nextRole) {
    if (!result?.final_answer) return;
    setRole(nextRole);
    try {
      const d = await api('/api/reveal', {
        method: 'POST',
        body: JSON.stringify({ text: result.final_answer, role: nextRole }),
      });
      setRevealed(d);
    } catch (e) {
      setError(e.message);
    }
  }

  return (
    <div className="space-y-5">
      <Card title="Connected Agent" icon="🤖">
        <p className="text-xs text-gray-400 mb-4">
          An agent that reaches your platforms through Composio-managed connections.
          Every tool response passes Protegrity Gate 1 before the model sees it, so
          real PII never enters the LLM context.
        </p>

        <div className="flex flex-wrap gap-2 mb-3">
          {PROMPTS.map((p, i) => (
            <button key={i} onClick={() => setPrompt(p)}
              className="text-xs bg-gray-800/60 border border-gray-700 text-gray-300 hover:border-indigo-500 hover:text-indigo-300 px-3 py-1.5 rounded-full transition-colors">
              💬 {p}
            </button>
          ))}
        </div>

        <div className="flex gap-2 items-center">
          <input
            className="flex-1 bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm focus:border-indigo-500 focus:outline-none placeholder-gray-600"
            placeholder="Ask the agent to do something with your connected platforms…"
            value={prompt}
            onChange={e => setPrompt(e.target.value)}
            onKeyDown={e => { if (e.key === 'Enter' && !running) run(); }}
          />
          <select value={runMode} onChange={e => setRunMode(e.target.value)}
            className="bg-gray-800 border border-gray-700 rounded-lg px-2 py-2 text-xs text-gray-300">
            <option value="auto">Auto</option>
            <option value="live">Live tools</option>
            <option value="demo">Sample data</option>
          </select>
          <Btn onClick={run} disabled={!prompt.trim() || running}>
            {running ? <Spinner /> : 'Run'}
          </Btn>
        </div>

        <div className="mt-3"><ErrorBox>{error}</ErrorBox></div>
      </Card>

      <Card title="Connected platforms" icon="🔌">
        <p className="text-xs text-gray-400 mb-3">
          Live from Composio. This app stores one credential
          (<span className="font-mono">COMPOSIO_API_KEY</span>) — no platform tokens.
        </p>
        <ConnectionsPanel apps={apps} onRefresh={onRefresh} showAll />
      </Card>

      {result && (
        <Card title="Result" icon="📋">
          <div className="flex gap-2 items-center mb-3 text-xs flex-wrap">
            <span className={`px-2 py-0.5 rounded border font-mono ${
              result.mode === 'live'
                ? 'bg-green-900/40 text-green-300 border-green-700/40'
                : 'bg-amber-900/40 text-amber-300 border-amber-700/40'
            }`}>
              {result.mode === 'live' ? 'live tools' : 'sample data'}
            </span>
            <span className="text-gray-400">
              {result.total_steps} tool step(s) · Gate 1 applied to each
            </span>
          </div>

          {(result.pipeline || []).map((s, i) => (
            <div key={i} className="mb-3 border border-gray-800 rounded-lg overflow-hidden">
              <div className="bg-gray-900/60 px-3 py-2 text-xs flex gap-2 items-center">
                <span className="text-blue-300 font-mono">{s.app}</span>
                <span className="text-gray-500">→</span>
                <span className="text-gray-300">{s.action}</span>
                <span className="ml-auto text-orange-300">
                  {(s.pii_elements || []).length} PII tokenised
                </span>
              </div>
              <JsonView json={s.protected_data} />
            </div>
          ))}

          {result.final_answer && (
            <div className="mt-4">
              <div className="flex gap-2 items-center mb-2 flex-wrap">
                <span className="text-xs text-gray-400">Gate 2 — view as:</span>
                {[['admin', '🔓 Admin'], ['analyst', '🔒 Analyst'], ['viewer', '🔑 Viewer']]
                  .map(([id, label]) => (
                    <button key={id} onClick={() => reveal(id)}
                      className={`px-2 py-1 text-xs rounded border transition-colors ${
                        role === id
                          ? 'border-indigo-500 bg-indigo-900/30 text-indigo-200'
                          : 'border-gray-700 text-gray-400 hover:text-gray-200'}`}>
                      {label}
                    </button>
                  ))}
              </div>
              <JsonView json={revealed?.text || result.final_answer} />
              {revealed?.reason && (
                <p className="text-xs text-gray-500 mt-1">{revealed.reason}</p>
              )}
            </div>
          )}
        </Card>
      )}
    </div>
  );
}

/* ── Header ────────────────────────────────────────────────────── */
function Header({ health, apps }) {
  const connectedCount = (apps?.toolkits || []).filter(t => t.connected).length;
  return (
    <header className="bg-gray-900/80 border-b border-gray-800 px-6 py-3 backdrop-blur sticky top-0 z-10">
      <div className="max-w-5xl mx-auto flex items-center justify-between gap-4 flex-wrap">
        <div>
          <h1 className="text-base font-bold text-indigo-300">🛡️ Protegrity Secure Data Bridge</h1>
          <p className="text-gray-500 text-xs">Connected Agent — platform connections managed by Composio</p>
        </div>
        <div className="flex gap-2 flex-wrap">
          <Badge ok={health?.protegrity?.classify} label="Protegrity" />
          <Badge ok={health?.composio?.reachable} label={`Composio (${connectedCount})`} />
        </div>
      </div>
    </header>
  );
}

/* ── App ───────────────────────────────────────────────────────── */
function App() {
  const [health, setHealth] = useState(null);
  const [apps, setApps] = useState(null);

  const refresh = () => {
    api('/api/health').then(setHealth).catch(() => {});
    api('/api/connected-apps').then(setApps).catch(() => {});
  };

  useEffect(() => { refresh(); }, []);

  return (
    <div className="min-h-screen bg-gray-950">
      <Header health={health} apps={apps} />
      <main className="max-w-5xl mx-auto p-6 space-y-5">
        <ConnectedAgentTab apps={apps} onRefresh={refresh} health={health} />
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
